services:
  status-db:
    image: postgres:16
    environment:
      # Defaults match the pg_isready healthcheck below. The password has no default
      # on purpose: compose fails loudly rather than starting an unconfigured database.
      POSTGRES_USER: ${POSTGRES_USER:-statuswatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-statuswatch}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U statuswatch"]
      interval: 5s
      timeout: 3s
      retries: 5

  status-backend:
    image: 841702866884.dkr.ecr.eu-north-1.amazonaws.com/status-watch/backend
    env_file:
      - ./server/.env
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    depends_on:
      status-db:
        condition: service_healthy
    ports:
      - "4000:4000"

  status-frontend:
    image: 841702866884.dkr.ecr.eu-north-1.amazonaws.com/status-watch/frontend
    depends_on:
      status-backend:
        condition: service_healthy
    ports:
      - "80:80"

volumes:
  dbdata:
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: ./server
        run: npm ci
      - name: Run tests
        working-directory: ./server
        run: npm test
      - name: Build backend image
        run: docker build -t status-backend ./server

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::841702866884:role/github-actions-ecr-push-role
          aws-region: eu-north-1
          role-skip-session-tagging: true

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push backend image
        run: |
          docker tag status-backend ${{ steps.login-ecr.outputs.registry }}/status-watch/backend:latest
          docker push ${{ steps.login-ecr.outputs.registry }}/status-watch/backend:latest

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: ./client
        run: npm ci
      - name: Run tests
        working-directory: ./client
        run: npm test
      - name: Build frontend image
        run: docker build -t status-frontend ./client

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::841702866884:role/github-actions-ecr-push-role
          aws-region: eu-north-1
          role-skip-session-tagging: true

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push frontend image
        run: |
          docker tag status-frontend ${{ steps.login-ecr.outputs.registry }}/status-watch/frontend
          docker push ${{ steps.login-ecr.outputs.registry }}/status-watch/frontend

  deploy:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::841702866884:role/github-actions-ecr-push-role
          aws-region: eu-north-1
          role-skip-session-tagging: true

      - name: Deploy to EC2 via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command --instance-ids "${{ vars.EC2_INSTANCE_ID }}" --document-name "AWS-RunShellScript" --parameters commands='["cd /home/ubuntu/StatusWatch","git config --system --add safe.directory /home/ubuntu/StatusWatch","git pull","aws ecr get-login-password --region eu-north-1 | docker login --username AWS --password-stdin ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.eu-north-1.amazonaws.com","docker compose pull","docker compose up -d"]' --query "Command.CommandId" --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "${{ vars.EC2_INSTANCE_ID }}"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ vars.EC2_INSTANCE_ID }}"